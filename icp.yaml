canisters:
  - name: backend
    init_args:
      path: work/install-args.did
      format: candid
    recipe:
      type: "@dfinity/motoko@v4.1.0"
      configuration:
        main: backend/main.mo
        candid: backend/backend.did
  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: dist
        build:
          - npm run build
networks:
  - name: local
    mode: managed
    gateway:
      port: 8197
